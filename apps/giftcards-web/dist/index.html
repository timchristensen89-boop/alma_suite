<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/alma-giftcards-logo.svg" />
    <!-- viewport-fit=cover lets the counter shell paint under the notch and the
         home indicator, which is what env(safe-area-inset-*) then pads back. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Added to an iPhone home screen the counter opens without Safari's
         chrome, so it behaves like the till app it is rather than a tab
         somebody can navigate away from mid-service. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALMA Counter" />
    <meta name="theme-color" content="#1a2717" />
    <link rel="apple-touch-icon" href="/brand/alma-giftcards-logo.svg" />
    <title>ALMA Gift Cards</title>
    <script type="module" crossorigin src="/assets/index-CNRKQd4w.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CMfDvOOo.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      try { if (localStorage.getItem('alma.theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
    </script>
  </body>
</html>
