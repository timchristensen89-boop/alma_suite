name: CI

# Manual-only while the Actions minutes are exhausted: every pull_request/push
# run was failing at queue time and emailing a failure notice. Restore the
# pull_request + push triggers when minutes are topped up.
on:
  workflow_dispatch:

# Cancel duplicate runs for the same PR / push (saves Actions minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @prisma/client types are generated, not committed. The API package's
      # typecheck depends on them, so run this before `pnpm typecheck`.
      - name: Generate Prisma client
        run: pnpm db:generate

      # @alma/shared and @alma/db publish their type declarations from
      # `dist/` (see their package.json `main` + `types` fields), and
      # `dist/` is gitignored. Build them so downstream packages can
      # resolve `@alma/shared` / `@alma/db` during typecheck.
      - name: Build internal type declarations
        run: pnpm --filter @alma/shared --filter @alma/db build

      - name: Typecheck all packages
        run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same prerequisites as the typecheck job: the Prisma client and the
      # internal type declarations the test files import through @alma/*.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build internal type declarations
        run: pnpm --filter @alma/shared --filter @alma/db build

      # The pure suites — no database required. The seven DB-bound stocktake
      # cases self-skip without DATABASE_URL (see the test file); everything
      # else must pass. ~900 cases, well under a minute.
      # One line on purpose: with `>-`, continuation lines indented deeper
      # than the first are kept literal, so the step ran `pnpm --filter X`
      # with no command and died with "Unknown option: 'recursive'".
      - name: Run tests
        run: pnpm --filter @alma/api --filter @alma/stock-api --filter @alma/stock-web --filter @alma/reports-web --filter @alma/menus-web --filter @alma/ui --filter @alma/db test

  # Corporate gift cards against a real Postgres: the pool-allocation
  # conditional updates, the allocation-key uniqueness and the drain/redeem
  # filters are things a mocked Prisma cannot prove. The suite self-skips
  # without ALMA_TEST_DATABASE_URL, so the plain `test` job above stays
  # database-free; here it runs the whole migration history on an empty
  # postgres:16 first, which also proves the migrations apply cleanly.
  db-integration:
    name: Postgres integration (corporate gift cards, menus)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alma
          POSTGRES_PASSWORD: alma
          POSTGRES_DB: alma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://alma:alma@127.0.0.1:5432/alma_test
      ALMA_TEST_DATABASE_URL: postgresql://alma:alma@127.0.0.1:5432/alma_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build internal type declarations
        run: pnpm --filter @alma/shared --filter @alma/db build

      # Full history on an empty database: fails here if a migration does
      # not apply in order on a clean Postgres.
      - name: Apply the full migration history
        run: pnpm --filter @alma/db migrate:deploy

      - name: Run the corporate gift card integration suite
        run: pnpm --filter @alma/api exec node --import tsx --test src/services/corporate-gift-card.integration.test.ts

      # Menu Editor: drafts, publish (real PDF in headless Chrome), restore,
      # several menus per venue, and archiving racing every write. The runner
      # image ships google-chrome, which menu-pdf.ts finds on its own;
      # ALMA_TEST_REQUIRE_CHROME=1 makes a missing Chrome fail the run rather
      # than skip the publish cases. One file at a time: both use this database.
      - name: Run the menu integration suites
        env:
          ALMA_TEST_REQUIRE_CHROME: '1'
        run: pnpm --filter @alma/api exec node --import tsx --test --test-concurrency=1 src/services/menu.integration.test.ts src/services/menu-archive-race.integration.test.ts src/services/menu-v2.integration.test.ts

  frontend-build:
    name: Frontend builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build internal type declarations
        run: pnpm --filter @alma/shared --filter @alma/db build

      # Every user-facing app must BUILD on every PR — typecheck alone missed
      # per-app tsconfig differences and vite-level breakage, so a merge could
      # pass CI and still fail on the deploy machine. Production env vars come
      # from each app's committed .env.production or its example.
      - name: Prime production env for apps without a committed one
        run: |
          for app in apps/*/; do
            if [ -f "$app/.env.production.example" ] && [ ! -f "$app/.env.production" ]; then
              cp "$app/.env.production.example" "$app/.env.production"
            fi
          done

      # One line for the same reason as the test step above.
      - name: Build the frontends
        run: pnpm --filter @alma/pos-web --filter @alma/staff-web --filter @alma/giftcards-web --filter @alma/menus-web --filter @alma/reserve-web --filter @alma/stock-web build

  domain-boundaries:
    name: Domain boundary guard (warn)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Reports cross-domain DB access (suite ↔ stock ↔ workforce) for the
      # stock-forward separation. WARN mode: informational, never fails the
      # build. Flip to `--strict` once the runtime worklist reaches zero.
      - name: Check domain boundaries
        run: node scripts/check-domain-boundaries.mjs

  # Vite production builds need real-looking https URLs in VITE_* env vars
  # (apps/web/.env.production etc.) — those are deploy-time concerns, not
  # CI concerns, so we don't run `pnpm build` here. Re-add as a job once
  # the env values are mirrored as GitHub Actions secrets.
